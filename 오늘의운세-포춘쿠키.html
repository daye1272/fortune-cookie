<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 · 포춘쿠키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E7;
    --paper-deep:#F3E7D4;
    --ink:#2B211B;
    --ink-muted:#8A7B6C;
    --seal:#C23B22;
    --seal-dark:#9C2C18;
    --gold:#C79A3B;
    --card:#FFFDF8;
    --line: rgba(43,33,27,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body{
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(199,154,59,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(194,59,34,0.08), transparent 45%);
  }

  .stage{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 56px 24px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mark{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--seal);
    color: #FBF3E7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -1px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    margin-bottom: 18px;
    transform: rotate(-6deg);
  }

  .host-line{
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--ink-muted);
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: 0.2px;
  }

  h1{
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 2.15rem;
    line-height: 1.25;
    margin: 0 0 10px;
    text-align: center;
    letter-spacing: -0.5px;
  }

  .lede{
    color: var(--ink-muted);
    font-size: 0.98rem;
    text-align: center;
    margin: 0 0 48px;
    line-height: 1.6;
  }

  /* ---- Cookie stage ---- */
  .cookie-stage{
    position: relative;
    width: 220px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .cookie-plate{
    position: absolute;
    bottom: 6px;
    width: 168px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(43,33,27,0.14), transparent 70%);
  }

  .cookie{
    position: relative;
    width: 240px;
    height: 221px;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 10px 14px rgba(43,33,27,0.22));
    transition: transform 0.25s ease;
    transform-origin: center 55%;
  }

  .cookie:hover{ transform: scale(1.05) rotate(-2deg); }

  .cookie img{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  .cookie.shaking{
    animation: shake 0.55s ease-in-out;
  }
  @keyframes shake{
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-7deg) translateX(-2px); }
    40% { transform: rotate(6deg) translateX(2px); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(4deg); }
  }

  .whole-img{ opacity: 1; transition: opacity 0.1s ease; }

  .half-img{
    opacity: 0;
  }
  .half-left{
    clip-path: polygon(55.3% 0%, 52.2% 32.1%, 46.1% 49.1%, 35.1% 100%, 0% 100%, 0% 0%);
  }
  .half-right{
    clip-path: polygon(55.3% 0%, 100% 0%, 100% 100%, 35.1% 100%, 46.1% 49.1%, 52.2% 32.1%);
  }

  .cookie.split{
    animation: none;
  }
  .cookie.split .whole-img{ opacity: 0; }
  .cookie.split .half-left{
    opacity: 1;
    animation: crackLeft 0.55s ease forwards;
  }
  .cookie.split .half-right{
    opacity: 1;
    animation: crackRight 0.55s ease forwards;
  }
  @keyframes crackLeft{
    0%{ transform: translate(0,0) rotate(0deg); }
    100%{ transform: translate(-34px, 30px) rotate(-14deg); }
  }
  @keyframes crackRight{
    0%{ transform: translate(0,0) rotate(0deg); }
    100%{ transform: translate(26px, -16px) rotate(9deg); }
  }

  .hint{
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin-top: -18px;
    margin-bottom: 34px;
    letter-spacing: 0.2px;
  }

  button{
    font-family: 'Noto Sans KR', sans-serif;
    border: none;
    cursor: pointer;
  }

  .draw-btn{
    background: var(--seal);
    color: #FBF3E7;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--seal-dark);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: 0.2px;
  }
  .draw-btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--seal-dark);
  }
  .draw-btn:disabled{
    opacity: 0.55;
    cursor: default;
    transform: none;
    box-shadow: 0 6px 0 var(--seal-dark);
  }

  /* ---- Result slip ---- */
  .slip-wrap{
    width: 100%;
    margin-top: 40px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.5s ease, opacity 0.4s ease 0.05s;
  }
  .slip-wrap.show{
    max-height: 600px;
    opacity: 1;
  }

  .slip{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 30px 28px;
    position: relative;
    box-shadow: 0 14px 30px rgba(43,33,27,0.10);
  }
  .slip::before, .slip::after{
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 10px;
    background: repeating-linear-gradient(90deg, var(--paper) 0 8px, transparent 8px 16px);
  }
  .slip::before{ top: -5px; }
  .slip::after{ bottom: -5px; }

  .slip-eyebrow{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 2px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 14px;
  }

  .slip-message{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 1.28rem;
    line-height: 1.65;
    text-align: center;
    color: var(--ink);
    margin: 0 0 26px;
  }

  .divider{
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 22px;
  }

  .lucky-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .lucky-label{
    font-size: 0.86rem;
    color: var(--ink-muted);
  }

  .lucky-food{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--seal-dark);
    background: rgba(194,59,34,0.08);
    padding: 5px 14px;
    border-radius: 999px;
  }

  .slip-actions{
    display: flex;
    justify-content: center;
  }

  .copy-btn{
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .copy-btn:hover{
    border-color: var(--ink-muted);
    background: rgba(43,33,27,0.04);
  }
  .copy-btn.copied{
    border-color: var(--seal);
    color: var(--seal-dark);
    background: rgba(194,59,34,0.06);
  }

  .again{
    margin-top: 18px;
    text-align: center;
  }
  .again button{
    background: none;
    color: var(--ink-muted);
    font-size: 0.86rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .again button:hover{ color: var(--ink); }

  @media (max-width: 380px){
    h1{ font-size: 1.8rem; }
    .cookie{ width: 200px; height: 184px; }
  }

  @media (prefers-reduced-motion: reduce){
    .cookie.shaking{ animation: none; }
    .cookie.split .half-left, .cookie.split .half-right{ animation: none; opacity: 0; }
    .slip-wrap{ transition: none; }
  }
</style>
</head>

  <button class="draw-btn" id="drawBtn">운세 뽑기</button>

  <div class="slip-wrap" id="slipWrap">
    <div class="slip">
      <div class="slip-eyebrow">오늘의 운세</div>
      <p class="slip-message" id="slipMessage"></p>
      <div class="divider"></div>
      <div class="lucky-row">
        <span class="lucky-label">행운의 음식</span>
        <span class="lucky-food" id="luckyFood"></span>
      </div>
      <div class="slip-actions">
        <button class="copy-btn" id="copyBtn">운세 복사하기</button>
      </div>
    </div>
    <div class="again">
      <button id="againBtn">다시 뽑기</button>
    </div>
  </div>
</div>

<script>
  const fortunes = [
    '오늘 배운 것이 미래의 자산이 됩니다. 📚',
    '작은 노력이 모여 큰 성과를 만듭니다.',
    '새로운 것을 배우기에 완벽한 날입니다.',
    '꾸준함이 재능을 이깁니다. 포기하지 마세요!',
    '오늘의 실수는 내일의 성장입니다.',
    '진심은 언젠가 통하게 되어있습니다. 조급해하지 마세요.',
    '건강한 식단이 하루를 바꿉니다.',
    '규칙적인 생활이 최고의 보약입니다.',
    '예상치 못한 곳에서 기회가 찾아올 수 있습니다.',
    '충분한 휴식이 내일의 에너지가 됩니다.',
    '오늘의 당신은 매력이 넘칩니다. 자신감을 가지세요!'
  ];

  const luckyFoods = [
    '계란찜', '매운갈비찜', '된장찌개', '김치찌개',
    '순두부찌개', '뚝배기불고기', '제육볶음'
  ];

  const cookie = document.getElementById('cookie');
  const drawBtn = document.getElementById('drawBtn');
  const lede = document.getElementById('lede');
  const slipWrap = document.getElementById('slipWrap');
  const slipMessage = document.getElementById('slipMessage');
  const luckyFoodEl = document.getElementById('luckyFood');
  const copyBtn = document.getElementById('copyBtn');
  const againBtn = document.getElementById('againBtn');

  function pickRandom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function drawFortune(){
    drawBtn.disabled = true;
    slipWrap.classList.remove('show');
    cookie.classList.remove('split');
    cookie.classList.add('shaking');

    setTimeout(() => {
      cookie.classList.remove('shaking');
      cookie.classList.add('split');
      lede.textContent = '대상 대학생 봉사단과 형제식당이 대학생들의 청춘을 응원합니다❤️';

      const message = pickRandom(fortunes);
      const food = pickRandom(luckyFoods);
      slipMessage.textContent = message;
      luckyFoodEl.textContent = food;
      copyBtn.textContent = '운세 복사하기';
      copyBtn.classList.remove('copied');

      requestAnimationFrame(() => {
        slipWrap.classList.add('show');
        setTimeout(() => {
          slipWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 150);
      });

      drawBtn.disabled = false;
    }, 550);
  }

  drawBtn.addEventListener('click', drawFortune);
  cookie.addEventListener('click', () => {
    if (!drawBtn.disabled) drawFortune();
  });

  againBtn.addEventListener('click', () => {
    cookie.classList.remove('split');
    slipWrap.classList.remove('show');
  });

  copyBtn.addEventListener('click', () => {
    const text = `[오늘의 운세]\n${slipMessage.textContent}\n\n행운의 음식: ${luckyFoodEl.textContent}`;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = '복사 완료!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '운세 복사하기';
        copyBtn.classList.remove('copied');
      }, 2000);
    }).catch(() => {
      alert('복사에 실패했습니다. 다시 시도해주세요.');
    });
  });
</script>

</body>
